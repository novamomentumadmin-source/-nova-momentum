<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Nova Momentum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class='logo-link' href='/'>
        <img src="logo.svg" alt="Nova Momentum" height="40">
      </a>
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your email to receive reset instructions</p>
      
      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      
      <form id="resetRequestForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <div id="resetFormWrap" class="hidden" style="margin-top:1.5rem;">
        <p class="subtitle" style="margin-bottom:1rem;">Set a new password (demo mode)</p>
        <form id="newPasswordForm">
          <input type="hidden" id="resetEmail">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="form-group">
            <label for="confirmNew">Confirm New Password</label>
            <input type="password" id="confirmNew" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>
      </div>
      
      <div class="auth-links">
        <a href='/login'>Back to Log In</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('resetRequestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const result = await handlePasswordReset(email);
      const success = document.getElementById('successMsg');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      success.textContent = result.message;
      success.style.display = 'block';
      
      if (result.allowReset) {
        document.getElementById('resetFormWrap').classList.remove('hidden');
        document.getElementById('resetEmail').value = email;
      }
    });

    document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      const pass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNew').value;
      const err = document.getElementById('errorMsg');
      const success = document.getElementById('successMsg');
      
      if (pass !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return;
      }
      const result = await updatePassword(email, pass);
      if (result.success) {
        success.textContent = result.message;
        success.style.display = 'block';
        err.style.display = 'none';
        setTimeout(() => window.location.href = 'login.html', 2000);
      } else {
        err.textContent = result.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
