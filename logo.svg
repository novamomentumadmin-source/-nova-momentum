<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <!-- Stylized N / Momentum mark -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F5D76E"/>
      <stop offset="100%" style="stop-color:#C5A028"/>
    </linearGradient>
  </defs>
  <!-- Abstract momentum shape: ascending bars + N -->
  <g transform="translate(4,8)">
    <rect x="0" y="28" width="6" height="16" rx="1" fill="url(#goldGrad)"/>
    <rect x="10" y="20" width="6" height="24" rx="1" fill="url(#goldGrad)"/>
    <rect x="20" y="10" width="6" height="34" rx="1" fill="url(#goldGrad)"/>
    <path d="M32 8 L40 8 L40 30 L52 8 L60 8 L60 44 L52 44 L52 22 L40 44 L32 44 Z" fill="url(#goldGrad)"/>
  </g>
  <!-- Company name -->
  <text x="72" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" letter-spacing="2" fill="#D4AF37">NOVA</text>
  <text x="72" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" letter-spacing="3" fill="#F5F5F5">MOMENTUM</text>
</svg>
