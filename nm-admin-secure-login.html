  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Access | Nova Momentum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class='logo-link' href='/'>
        <img src="logo.svg" alt="Nova Momentum" height="40">
      </a>
      <h1>Admin Access</h1>
      <p class="subtitle">Authorized personnel only</p>

      <!-- Shown when already logged in as admin -->
      <div id="alreadyLoggedIn" style="display:none;margin-bottom:1.5rem;">
        <p style="color:var(--text-secondary);margin-bottom:1rem;">You are currently logged in as admin.</p>
        <a class='btn btn-primary btn-block' href='/admin' style='margin-bottom:0.75rem;'>Go to Admin Panel</a>
        <button type="button" id="logoutFromLogin" class="btn btn-outline btn-block">Log Out</button>
      </div>
      
      <div id="errorMsg" class="error-msg"></div>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="email">Admin Email</label>
          <input type="email" id="email" name="email" required autocomplete="off" placeholder="novamomentum.admin@gmail.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In to Admin</button>
      </form>

      <p style="margin-top:1.5rem;text-align:center;">
        <a href='/' style='color:var(--text-muted);font-size:0.9rem;'>← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = getSession();
      const already = document.getElementById('alreadyLoggedIn');
      const form = document.getElementById('adminLoginForm');

      if (session && session.role === 'admin') {
        already.style.display = 'block';
      }

      document.getElementById('logoutFromLogin').addEventListener('click', () => {
        clearSession();
        already.style.display = 'none';
        form.reset();
        alert('Logged out successfully. You can log in again below.');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const result = await handleAdminLogin(email, password);
        const err = document.getElementById('errorMsg');
        
        if (result.success) {
          window.location.href = 'admin.html';
        } else {
          err.textContent = result.message || 'Invalid admin credentials.';
          err.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
